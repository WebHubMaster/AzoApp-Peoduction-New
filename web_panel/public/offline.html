<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline — AzoApp</title>
  <style>
    :root { --p:#0D47A1; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
      background:linear-gradient(160deg,#0D47A1,#1565C0); color:#fff; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { text-align:center; max-width:420px; }
    .badge { width:88px; height:88px; border-radius:24px; background:rgba(255,255,255,.14);
      display:grid; place-items:center; margin:0 auto 20px; }
    h1 { font-size:24px; margin:0 0 8px; font-weight:800; }
    p { color:rgba(255,255,255,.82); line-height:1.5; margin:0 0 22px; font-size:15px; }
    button { background:#fff; color:var(--p); border:0; border-radius:14px; padding:13px 26px;
      font-weight:700; font-size:15px; cursor:pointer; }
    small { display:block; margin-top:18px; color:rgba(255,255,255,.6); font-size:12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Some features need an internet connection. Bookings, wallet and payments always require you to be online. Please reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <small>AzoApp — service at your doorstep</small>
  </div>
</body>
</html>
